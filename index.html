<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premios Nannan - Votación</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen pb-12">

    <!-- Encabezado -->
    <header class="bg-amber-600 text-white p-6 text-center shadow-lg sticky top-0 z-50">
        <h1 class="text-2xl font-bold tracking-wide">Premios Nannan</h1>
        <p class="text-amber-100 text-sm mt-1">Selecciona a tu chef favorito y emite tu voto</p>
    </header>

    <!-- Contenedor Principal -->
    <main class="max-w-md mx-auto p-4">
        <div id="mensaje" class="hidden mb-4 p-4 rounded-lg text-center font-semibold shadow"></div>
        
        <div id="grid-chefs" class="grid grid-cols-2 gap-4">
            <!-- Los chefs se cargarán dinámicamente aquí -->
        </div>
    </main>

    <script>
        let yaVoto = localStorage.getItem('voto_realizado');

        document.addEventListener('DOMContentLoaded', () => {
            if (yaVoto) {
                mostrarMensaje('Ya has emitido tu voto en este dispositivo.', 'bg-blue-100 text-blue-800 border border-blue-300');
            }
            cargarChefs();
        });

        function cargarChefs() {
    fetch('obtener_chefs.php')
        .then(res => res.json())
        .then(res => {
            if (res.success) {
                const container = document.getElementById('grid-chefs');
                container.innerHTML = '';
                res.data.forEach(chef => {
                    // Si no hay foto aún, usamos un placeholder neutro
                    const fotoUrl = chef.foto && chef.foto !== '' ? `img/${chef.foto}` : 'https://via.placeholder.com/150?text=Chef';
                    
                    container.innerHTML += `
                        <div class="bg-white rounded-xl shadow-md overflow-hidden flex flex-col justify-between p-3 border border-gray-100">
                            <div>
                                <!-- Envoltorio con aspect-square (1:1) -->
                                <div class="w-full aspect-square overflow-hidden rounded-lg mb-3 bg-gray-100">
                                    <img src="${fotoUrl}" alt="${chef.nombre}" class="w-full h-full object-cover object-center">
                                </div>
                                <h3 class="font-bold text-gray-900 text-sm text-center leading-snug">${chef.nombre}</h3>
                            </div>
                            <button onclick="votar(${chef.id})" 
                                ${yaVoto ? 'disabled' : ''} 
                                class="mt-3 w-full bg-amber-600 hover:bg-amber-700 disabled:bg-gray-300 text-white text-xs font-bold py-2 px-2 rounded-lg transition duration-200">
                                ${yaVoto ? 'Votado' : 'Votar'}
                            </button>
                        </div>
                    `;
                });
            }
        });
}

        function votar(chefId) {
            if (yaVoto) return;

            if (!confirm('¿Confirmas tu voto por este chef? Solo puedes votar una vez.')) return;

            fetch('votar.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chef_id: chefId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('voto_realizado', 'true');
                    yaVoto = true;
                    mostrarMensaje(data.message, 'bg-green-100 text-green-800 border border-green-300');
                    cargarChefs();
                } else {
                    mostrarMensaje(data.message, 'bg-red-100 text-red-800 border border-red-300');
                }
            });
        }

        function mostrarMensaje(text, classes) {
            const el = document.getElementById('mensaje');
            el.className = `mb-4 p-4 rounded-lg text-center font-semibold shadow ${classes}`;
            el.innerText = text;
            el.classList.remove('hidden');
        }
    </script>
</body>
</html>
