<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maestros Culinarios - VII Edición</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CDN Oficial de FingerprintJS -->
    <script src="https://openfpcdn.io/fingerprintjs/v3"></script>
    <script src="https://www.google.com/recaptcha/api.js?render=6LfDSsktAAAAAKBzmKU_E3Vx2q4skxb1LnYtJ_8P"></script>
</head>
<body class="bg-slate-50 bg-[url('img/maestros-culinarios-fondo-2.jpg')] bg-no-repeat bg-cover bg-fixed bg-center text-gray-800 min-h-screen pb-12 font-sans">

    <!-- Encabezado Unificado -->
    <header class="relative bg-white/80 backdrop-blur-md pt-10 pb-12 px-4 text-center border-b border-gray-200 shadow-sm">
        <div class="relative max-w-xl mx-auto flex flex-col items-center">
            <span class="text-xs font-extrabold tracking-widest text-amber-700 uppercase mb-1">MAESTROS CULINARIOS</span>
            <h1 class="text-3xl sm:text-4xl font-serif text-[#1E5A32] font-black tracking-tight leading-tight">
                Premios <span class="font-light italic text-emerald-700">Ñam Ñam</span>
            </h1>
            <p class="mt-1 text-xs sm:text-sm text-gray-600 font-medium">Degusta las propuestas y vota por tu tapa favorita</p>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="max-w-5xl mx-auto px-4 mt-8 relative z-10">
        <div id="mensaje" class="hidden mb-6 p-4 rounded-xl text-center font-semibold shadow-md"></div>
        
        <div id="grid-chefs" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
            <!-- Las tapas se cargarán dinámicamente aquí -->
        </div>
    </main>

    <footer class="mt-12 text-center text-xs text-gray-500 border-t border-gray-200/80 bg-white/60 backdrop-blur-sm py-6">
        <p class="font-semibold tracking-wider text-gray-600 uppercase">CERVEZAS ALHAMBRA | IDEAL | Maestros Culinarios</p>
    </footer>

    <script>
    let yaVoto = localStorage.getItem('voto_realizado');
    let visitorId = null;

    // Generador de huella alternativo resistente a modo incógnito y Firefox
    async function generarHuellaFallback() {
        try {
            const rawComponents = [
                navigator.userAgent,
                navigator.language,
                navigator.hardwareConcurrency || 4,
                screen.width + "x" + screen.height,
                screen.colorDepth,
                new Date().getTimezoneOffset()
            ].join('||');

            const msgUint8 = new TextEncoder().encode(rawComponents);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 32);
        } catch (e) {
            return 'device_' + (screen.width * screen.height) + '_' + navigator.hardwareConcurrency;
        }
    }

    // Obtener huella principal o de respaldo
    async function obtenerHuella() {
        if (visitorId) return visitorId;

        if (typeof FingerprintJS !== 'undefined') {
            try {
                const fp = await FingerprintJS.load();
                const result = await fp.get();
                if (result && result.visitorId) {
                    visitorId = result.visitorId;
                    return visitorId;
                }
            } catch (err) {
                console.warn("FingerprintJS bloqueado, activando fallback...");
            }
        }

        visitorId = await generarHuellaFallback();
        return visitorId;
    }

    document.addEventListener('DOMContentLoaded', () => {
        obtenerHuella();
        cargarTapas();
    });

    function cargarTapas() {
        // 1. Consultar estado de la votación
        fetch('obtener_estado.php?v=' + new Date().getTime())
            .then(res => res.json())
            .then(resStatus => {
                const votacionAbierta = resStatus.success ? resStatus.votacion_abierta : true;

                // Mensajes prioritarios según el estado y el usuario
                if (!votacionAbierta) {
                    mostrarMensaje('La votación está pausada actualmente. Consulta las tapas disponibles mientras se abre el proceso.', 'bg-amber-50 text-amber-800 border border-amber-200');
                } else if (yaVoto) {
                    mostrarMensaje('Ya has emitido tu voto en este dispositivo.', 'bg-blue-50 text-blue-800 border border-blue-200');
                } else {
                    ocultarMensaje();
                }

                // 2. Cargar siempre la lista de tapas
                return fetch('obtener_chefs.php').then(res => res.json()).then(resChefs => {
                    return { chefs: resChefs, votacionAbierta: votacionAbierta };
                });
            })
            .then(data => {
                if (data && data.chefs && data.chefs.success) {
                    const container = document.getElementById('grid-chefs');
                    container.innerHTML = '';
                    
                    data.chefs.data.forEach(tapa => {
                        const fotoUrl = tapa.foto_tapa && tapa.foto_tapa !== '' ? `img/${tapa.foto_tapa}` : 'https://via.placeholder.com/200?text=Tapa';
                        const tituloPlato = tapa.nombre_tapa || `Tapa ${tapa.id}`;
                        
                        // Estado del botón: deshabilitado si está pausada O si ya votó
                        const estaPausada = !data.votacionAbierta;
                        const botonDeshabilitado = estaPausada || yaVoto;

                        let textoBoton = 'Votar';
                        if (estaPausada) {
                            textoBoton = 'Votación pausada';
                        } else if (yaVoto) {
                            textoBoton = 'Votado';
                        }

                        container.innerHTML += `
                            <div class="bg-white/90 backdrop-blur-sm rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between p-2.5 sm:p-3 transition hover:shadow-md">
                                <div>
                                    <div class="w-full aspect-square overflow-hidden rounded-lg bg-gray-100 border border-gray-100 mb-2">
                                        <img src="${fotoUrl}" alt="${tituloPlato}" class="w-full h-full object-cover object-center">
                                    </div>
                                    <h3 class="font-bold text-gray-900 text-xs sm:text-sm text-center leading-snug line-clamp-2 min-h-[2.25rem] flex items-center justify-center">
                                        ${tituloPlato}
                                    </h3>
                                </div>

                                <button onclick="votar(${tapa.id})" 
                                    ${botonDeshabilitado ? 'disabled' : ''} 
                                    class="mt-3 w-full bg-[#1E5A32] hover:bg-[#164325] disabled:bg-gray-300 disabled:text-gray-500 disabled:cursor-not-allowed text-white text-xs font-bold py-2 px-2 rounded-lg uppercase tracking-wider transition duration-150 shadow-sm">
                                    ${textoBoton}
                                </button>
                            </div>
                        `;
                    });
                }
            })
            .catch(err => console.error("Error al cargar la página:", err));
    }

    async function votar(tapaId) {
        if (yaVoto) return;

        const huella = await obtenerHuella();

        if (!huella) {
            alert('No se pudo procesar la solicitud. Por favor, recarga la página.');
            return;
        }

        if (!confirm('¿Confirmas tu voto por esta tapa? Solo puedes votar una vez.')) return;

        grecaptcha.ready(function() {
            grecaptcha.execute('6LfDSsktAAAAAKBzmKU_E3Vx2q4skxb1LnYtJ_8P', {action: 'votar'}).then(function(token) {
                
                fetch('votar.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        tapa_id: tapaId,
                        fingerprint: huella,
                        recaptcha_token: token
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        localStorage.setItem('voto_realizado', 'true');
                        yaVoto = true;
                        mostrarMensaje(data.message, 'bg-emerald-50 text-emerald-800 border border-emerald-200');
                        cargarTapas();
                    } else {
                        mostrarMensaje(data.message, 'bg-red-50 text-red-800 border border-red-200');
                    }
                })
                .catch(err => {
                    console.error("Error al votar:", err);
                    mostrarMensaje('Ocurrió un error al procesar tu voto. Inténtalo de nuevo.', 'bg-red-50 text-red-800 border border-red-200');
                });

            });
        });
    }

    function mostrarMensaje(text, classes) {
        const el = document.getElementById('mensaje');
        el.className = `mb-6 p-4 rounded-xl text-center font-semibold shadow-md ${classes}`;
        el.innerText = text;
        el.classList.remove('hidden');
    }

    function ocultarMensaje() {
        const el = document.getElementById('mensaje');
        el.classList.add('hidden');
    }
</script>
</body>
</html>
