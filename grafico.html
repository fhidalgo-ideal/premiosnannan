<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados en Tiempo Real - Premios Ñam Ñam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Librería de Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-50 bg-[url('img/maestros-culinarios-fondo-2.jpg')] bg-no-repeat bg-cover bg-fixed bg-center text-gray-800 min-h-screen flex flex-col font-sans">

    <!-- Encabezado Unificado -->
    <header class="relative bg-white/80 backdrop-blur-md pt-8 pb-10 px-4 text-center border-b border-gray-200 shadow-sm">
        <div class="relative max-w-xl mx-auto flex flex-col items-center">
            <span class="text-xs font-extrabold tracking-widest text-amber-700 uppercase mb-1">MAESTROS CULINARIOS</span>
            <h1 class="text-3xl sm:text-4xl font-serif text-[#1E5A32] font-black tracking-tight leading-tight">
                Premios <span class="font-light italic text-emerald-700">Ñam Ñam</span>
            </h1>
            <div class="mt-2 flex items-center space-x-2 bg-emerald-50 border border-emerald-200/80 px-3 py-1 rounded-full shadow-sm">
                <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
                <p id="estado-texto" class="text-xs font-semibold text-emerald-800">Cargando estado...</p>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal Ampliado a max-w-[95rem] -->
    <main class="max-w-[95rem] w-full mx-auto px-4 py-8 flex-1 flex flex-col gap-6">

        <!-- BANNER DEL GANADOR CON ACABADOS ELEGANTES -->
        <div id="card-ganador" class="hidden bg-white/90 backdrop-blur-md border-2 border-emerald-600 rounded-2xl p-6 shadow-xl transition-all">
            <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="flex items-center space-x-6">
                    <!-- Foto del Chef -->
                    <div class="relative">
                        <img id="ganador-foto-chef" src="" alt="Chef Ganador" class="w-24 h-24 rounded-full object-cover border-4 border-emerald-600 shadow-md">
                        <span class="absolute -bottom-2 -right-2 bg-amber-500 text-white text-xs font-black px-2 py-0.5 rounded-full shadow">🏆 1º</span>
                    </div>
                    <!-- Datos del Chef y Tapa -->
                    <div>
                        <span class="text-emerald-700 text-xs font-extrabold uppercase tracking-widest">¡Tapa y Chef Ganadores!</span>
                        <h2 id="ganador-tapa" class="text-2xl font-black text-gray-900"></h2>
                        <p class="text-gray-700 text-base font-semibold mt-1">
                            Chef: <span id="ganador-chef" class="text-[#1E5A32]"></span>
                        </p>
                        <p class="text-gray-500 text-sm">
                            Restaurante: <span id="ganador-restaurante" class="text-gray-800"></span>
                        </p>
                    </div>
                </div>
                <!-- Votos obtenidos -->
                <div class="bg-emerald-50 px-6 py-4 rounded-xl border border-emerald-200 text-center min-w-[140px]">
                    <span id="ganador-votos" class="block text-4xl font-extrabold text-[#1E5A32]">0</span>
                    <span class="text-xs text-emerald-800 font-bold uppercase tracking-wider">Votos Totales</span>
                </div>
            </div>
        </div>

        <!-- Área del Gráfico con Scroll Horizontal para asegurar la lectura de las 25 tapas -->
        <div class="flex-1 bg-white/85 backdrop-blur-md rounded-2xl p-4 sm:p-6 shadow-lg border border-gray-200/80 min-h-[480px] relative overflow-x-auto">
            <div class="w-full min-w-[1100px] h-[550px]">
                <canvas id="chartResultados"></canvas>
            </div>
        </div>
    </main>

    <footer class="text-center text-xs text-gray-500 border-t border-gray-200/80 bg-white/60 backdrop-blur-sm py-6">
        <p class="font-semibold tracking-wider text-gray-600 uppercase">CERVEZAS ALHAMBRA | IDEAL | Maestros Culinarios</p>
    </footer>

    <script>
        let desvelado = false;
        let confetiLanzado = false;
        let chartInstance = null;
        const imagenesCache = {};

        // Plugin del Eje X optimizado para 25 elementos (tamaño 28px)
        const pluginImagenesEjeX = {
            id: 'imagenesEjeX',
            afterDraw(chart) {
                const { ctx, chartArea: { bottom }, scales: { x } } = chart;
                const size = 28; // Ajustado a 28px para encajar perfectamente con 25 barras

                x.ticks.forEach((tick, index) => {
                    const xPos = x.getPixelForTick(index);
                    const rutaImagen = chart.data.datasets[0].fotos ? chart.data.datasets[0].fotos[index] : null;

                    if (rutaImagen) {
                        if (!imagenesCache[rutaImagen]) {
                            const img = new Image();
                            img.src = rutaImagen;
                            img.onload = () => chart.draw();
                            imagenesCache[rutaImagen] = img;
                        } else if (imagenesCache[rutaImagen].complete && imagenesCache[rutaImagen].naturalWidth !== 0) {
                            const img = imagenesCache[rutaImagen];
                            const yPos = bottom + 18;

                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(xPos, yPos, size / 2, 0, Math.PI * 2);
                            ctx.strokeStyle = '#1E5A32'; 
                            ctx.lineWidth = 1.5;
                            ctx.stroke();

                            ctx.beginPath();
                            ctx.arc(xPos, yPos, (size / 2) - 1, 0, Math.PI * 2);
                            ctx.closePath();
                            ctx.clip();

                            ctx.drawImage(img, xPos - size / 2, yPos - size / 2, size, size);
                            ctx.restore();
                        }
                    }
                });
            }
        };

        Chart.register(pluginImagenesEjeX);

        document.addEventListener('DOMContentLoaded', () => {
            inicializarGrafico();
            actualizarResultados();
            setInterval(actualizarResultados, 2000);
        });

        function lanzarConfeti() {
            const duracion = 3 * 1000;
            const animacionFin = Date.now() + duracion;

            const intervalo = setInterval(function() {
                const tiempoRestante = animacionFin - Date.now();

                if (tiempoRestante <= 0) {
                    return clearInterval(intervalo);
                }

                const particleCount = 50 * (tiempoRestante / duracion);

                confetti({
                    particleCount,
                    startVelocity: 30,
                    spread: 360,
                    ticks: 60,
                    origin: { x: Math.random() * 0.2 + 0.1, y: Math.random() - 0.2 }
                });
                confetti({
                    particleCount,
                    startVelocity: 30,
                    spread: 360,
                    ticks: 60,
                    origin: { x: Math.random() * 0.2 + 0.7, y: Math.random() - 0.2 }
                });
            }, 250);
        }

        function inicializarGrafico() {
            const ctx = document.getElementById('chartResultados').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Votos',
                        data: [],
                        fotos: [],
                        chefs: [],
                        backgroundColor: 'rgba(30, 90, 50, 0.85)',
                        borderColor: '#1E5A32',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { bottom: 35 } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#374151', stepSize: 1, precision: 0 },
                            grid: { color: 'rgba(0, 0, 0, 0.06)' }
                        },
                        x: {
                            ticks: { display: false },
                            grid: { display: false }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: (context) => context[0].label,
                                label: (context) => {
                                    const index = context.dataIndex;
                                    const chefInfo = chartInstance.data.datasets[0].chefs[index];
                                    let lineas = [` Votos: ${context.raw}`];
                                    if (desvelado && chefInfo && chefInfo.nombre) {
                                        lineas.push(` Chef: ${chefInfo.nombre}`);
                                        if (chefInfo.restaurante) lineas.push(` Restaurante: ${chefInfo.restaurante}`);
                                    }
                                    return lineas;
                                }
                            }
                        }
                    }
                }
            });
        }

        function actualizarResultados() {
            fetch('obtener_resultados.php')
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        desvelado = res.desvelado;

                        const estadoTexto = document.getElementById('estado-texto');
                        const cardGanador = document.getElementById('card-ganador');

                        if (desvelado && res.data.length > 0) {
                            estadoTexto.innerText = '¡Nombres, fotos y chefs desvelados!';

                            const ganador = res.data[0];
                            document.getElementById('ganador-tapa').innerText = ganador.etiqueta;
                            document.getElementById('ganador-chef').innerText = ganador.nombre_chef || 'Sin especificar';
                            document.getElementById('ganador-restaurante').innerText = ganador.restaurante || 'Sin especificar';
                            document.getElementById('ganador-votos').innerText = ganador.votos;
                            
                            const fotoChef = ganador.foto_chef ? `img/${ganador.foto_chef}` : 'https://via.placeholder.com/150';
                            document.getElementById('ganador-foto-chef').src = fotoChef;

                            cardGanador.classList.remove('hidden');

                            if (!confetiLanzado) {
                                lanzarConfeti();
                                confetiLanzado = true;
                            }
                        } else {
                            estadoTexto.innerText = 'Resultados en tiempo real';
                            cardGanador.classList.add('hidden');
                            confetiLanzado = false;
                        }

                        const etiquetas = res.data.map(item => item.etiqueta);
                        const votos = res.data.map(item => item.votos);
                        const fotos = res.data.map(item => item.foto_tapa ? `img/${item.foto_tapa}` : null);
                        const chefs = res.data.map(item => ({
                            nombre: item.nombre_chef,
                            restaurante: item.restaurante,
                            foto: item.foto_chef
                        }));

                        chartInstance.data.labels = etiquetas;
                        chartInstance.data.datasets[0].data = votos;
                        chartInstance.data.datasets[0].fotos = fotos;
                        chartInstance.data.datasets[0].chefs = chefs;

                        if (desvelado) {
                            const maxVotos = Math.max(...votos);
                            chartInstance.data.datasets[0].backgroundColor = votos.map(v => 
                                (v === maxVotos && maxVotos > 0) ? 'rgba(245, 158, 11, 0.95)' : 'rgba(30, 90, 50, 0.75)'
                            );
                        } else {
                            chartInstance.data.datasets[0].backgroundColor = 'rgba(30, 90, 50, 0.85)';
                        }

                        chartInstance.update();
                    }
                })
                .catch(err => console.error("Error al actualizar gráfico:", err));
        }
    </script>
</body>
</html>
